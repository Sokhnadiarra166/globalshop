global
  maxconn 4096

defaults
  mode tcp
  timeout connect 10s
  timeout client 1m
  timeout server 1m

listen cockroach
  bind :26257
  mode tcp
  balance roundrobin
  option httpchk GET /health?ready=1
  server roach1 roach1:26257 check port 8080
  server roach2 roach2:26257 check port 8080
  server roach3 roach3:26257 check port 8080
  server roach4 roach4:26257 check port 8080

listen stats
  bind :8404
  mode http
  stats enable
  stats uri /
  stats refresh 5s
